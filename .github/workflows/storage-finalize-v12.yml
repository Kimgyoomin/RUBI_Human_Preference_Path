name: Verify v9 storage finalize hotfix v12
on:
  push:
    branches: [hotfix/v9-storage-fast-v11]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused finalize tests
        run: node --test tests/storage-finalize-v12.test.mjs tests/storage-fast-v11.test.mjs tests/storage-hotfix-v10.test.mjs tests/no-repeat-v9.test.mjs tests/collector-recovery.test.mjs
      - name: Full test suite
        run: npm test
      - name: Build paste-ready v12 collector
        run: |
          node tools/build-storage-finalize-collector.mjs artifacts/RUBI_Collector_v9_storage_finalize_v12_Code.gs
          sha256sum artifacts/RUBI_Collector_v9_storage_finalize_v12_Code.gs | tee artifacts/SHA256.txt
          cp apps-script/release/storage-finalize-v12.gs artifacts/storage-finalize-v12-source.gs
          cat > artifacts/README_KO.txt <<'TXT'
          RUBI Human Preference Path v9 storage finalize hotfix v12
          - 기존 Apps Script 프로젝트의 Code.gs 전체를 RUBI_Collector_v9_storage_finalize_v12_Code.gs 내용으로 교체
          - 새 Google Sheet/새 Apps Script 프로젝트 생성 금지
          - 기존 배포를 새 버전으로 갱신하여 동일 deployment ID와 /exec URL 유지
          - RUBI_MAIN_COLLECTION_OPEN=true 유지
          - 질문/로봇/ONNX/protocolVersion/Google Sheet ID는 변경하지 않음
          - 일반 문항 저장은 v11 빠른 경로 유지
          - 마지막 완료 검증은 Trials 1회 + Runs 1회 bulk read 후 메모리에서 16/32 연결 확인
          - read-only Spreadsheet transient 오류는 최대 3회 짧게 재시도
          - 쓰기 요청 자체의 의미를 바꾸지 않으며 동일 submissionId 재시도/복구 구조 유지
          - CI는 실제 연구 Google Sheet에 trial/profile POST를 하지 않음
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: RUBI-v9-storage-finalize-v12
          path: |
            artifacts/RUBI_Collector_v9_storage_finalize_v12_Code.gs
            artifacts/RUBI_Collector_v9_storage_finalize_v12_Code.txt
            artifacts/storage-finalize-v12-source.gs
            artifacts/SHA256.txt
            artifacts/README_KO.txt
          if-no-files-found: error
