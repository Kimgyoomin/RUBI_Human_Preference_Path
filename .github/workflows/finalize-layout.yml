name: Finalize standalone layout

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-layout.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rubi-layout-migration
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 tools/finalize_standalone.py
      - run: python3 tools/check_assets.py
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Commit only the consolidated standalone app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests public tools docs .nvmrc
          if test -d web || git ls-files web/ | grep -q .; then git add -A web; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Consolidate root app, auto-load approved models, and validate asset fingerprints'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
