name: RUBI WASM Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy when GitHub Pages is configured
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rubi-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Preserve source provenance for media diagnostics
        run: |
          mkdir -p artifacts
          tar -czf artifacts/source-snapshot.tar.gz src tools tests apps-script docs config public/study.json package.json package-lock.json tsconfig.json vite.config.ts index.html
      - name: Test controller, hosted assets, survey and response API
        run: npm test
      - name: Build deployable isolated collector
        run: node tools/build-release-collector.mjs
      - name: Check TypeScript before rendering media
        run: npx tsc --noEmit
      - name: Validate assets (missing files allowed for draft only)
        run: python3 tools/check_assets.py
      - name: Prepare Chromium and film encoder
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Restore exact-input introduction media
        uses: actions/cache/restore@v4
        id: intro-cache
        with:
          path: public/media/rubi-intro-v1
          key: rubi-intro-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tools/build-intro-media.mjs', 'src/core/**', 'src/runtime/**', 'public/models/rubi-web/**') }}
      - name: Generate introduction from actual survey WASM policy
        if: steps.intro-cache.outputs.cache-hit != 'true'
        run: node tools/build-intro-media.mjs
      - name: Create and validate VP9 compatibility encoding
        run: node tools/encode-intro-compatible.mjs
      - name: Cache successfully generated introduction
        if: steps.intro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/media/rubi-intro-v1
          key: ${{ steps.intro-cache.outputs.cache-primary-key }}
      - name: Preserve introduction media diagnostics
        run: |
          mkdir -p artifacts/intro-build
          cp public/media/rubi-intro-v1/rubi-intro.mp4 artifacts/rubi-intro.mp4
          cp public/media/rubi-intro-v1/poster.jpg artifacts/rubi-intro-poster.jpg
          cp public/media/rubi-intro-v1/manifest.json artifacts/intro-build/report.json
      - name: Build for the standalone Pages path
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Run Chromium UI and WASM runtime smoke checks
        run: node tools/browser-smoke.mjs
      - name: Verify public build boundary and isolated main collector
        run: node tools/public-release-smoke.mjs
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Check Pages availability without changing repository visibility
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages-error.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build succeeded. Pages is not enabled or unavailable to this token/plan. Use Settings > Pages > GitHub Actions. Repository visibility is unchanged.'
          fi
  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static browser application
        id: deployment
        uses: actions/deploy-pages@v4
