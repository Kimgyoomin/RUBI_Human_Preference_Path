name: RUBI WASM Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the current site when GitHub Pages is configured
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rubi-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect standalone application
        id: source
        shell: bash
        run: |
          if test -f package.json; then
            echo 'initialize=false' >> "$GITHUB_OUTPUT"
          else
            echo 'initialize=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Read the pinned existing web application
        if: steps.source.outputs.initialize == 'true'
        uses: actions/checkout@v4
        with:
          repository: Kimgyoomin/RUBI_Nav_simulation_package
          ref: 59b761712a4cd280d545cfd29b3509a988671fdf
          path: _upstream
          persist-credentials: false
      - name: Import a standalone copy, never modify the simulation repository
        if: steps.source.outputs.initialize == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          source = Path('_upstream/web')
          if not source.is_dir():
              raise SystemExit('Pinned web source is missing')
          shutil.copytree(source, Path('.'), dirs_exist_ok=True)
          Path('docs').mkdir(exist_ok=True)
          Path('docs/UPSTREAM_WEB_README.md').write_text(Path('README.md').read_text())
          Path('docs/PROVENANCE.md').write_text(
              '# Source provenance\n\nStandalone copy of web/ from Kimgyoomin/RUBI_Nav_simulation_package, commit 59b761712a4cd280d545cfd29b3509a988671fdf.\n\nThe ROS/Gazebo packages are not imported and the source repository is not modified. The application has no runtime dependency on that repository. Original third-party licenses and dependency attribution still apply.\n')
          p = Path('vite.config.ts')
          p.write_text(p.read_text().replace('/RUBI_Nav_simulation_package/', '/RUBI_Human_Preference_Path/'))
          p = Path('src/main.ts')
          text = p.read_text()
          text = text.replace("localStorage.getItem(key)", "localStorage.getItem('RUBI_Human_Preference_Path:'+key)")
          text = text.replace("localStorage.setItem(key,", "localStorage.setItem('RUBI_Human_Preference_Path:'+key,")
          p.write_text(text)
          gitignore = '''node_modules/\ndist/\n_upstream/\ndata/\n.env\n.env.*\n!.env.example\n*.sqlite*\nprivate_assets/\n__pycache__/\nartifacts/\n*.onnx\n*.stl\n*.STL\n!public/models/rubi/encoder.onnx\n!public/models/rubi/policy.onnx\n!public/models/rubi/meshes/*.STL\n'''
          Path('.gitignore').write_text(gitignore)
          Path('README.md').write_text('''# RUBI Human Preference Path\n\nRUBI 이족 로봇의 경로 선호를 수집하는 독립적인 브라우저 WASM 앱입니다. ROS/Gazebo 저장소와 분리되어 있습니다.\n\n## 빠른 실행\n\nNode.js 24를 사용합니다.\n\n```bash\nnpm ci\nnpm test\nnpm run dev\n```\n\n브라우저에서 http://127.0.0.1:5173 을 열고 XML, ONNX 두 개, STL 9개가 들어 있는 폴더를 선택합니다. 파일 선택은 브라우저 내 읽기이며 서버 업로드가 아닙니다.\n\n## 실행 구조\n\nMuJoCo WASM -> 관측 구성 -> encoder.onnx (330 -> 32) -> policy.onnx (65 -> 6) -> PD torque -> MuJoCo step. 물리 dt=0.002 s, 추론 dt=0.01 s입니다. 두 경로를 계산한 뒤 simulation time 기준 1x로 재생합니다.\n\n## 배포\n\nSettings -> Pages -> Source: GitHub Actions를 선택한 다음 Actions -> RUBI WASM Web -> Run workflow에서 deploy를 체크합니다. GitHub Pages가 비활성 또는 현재 요금제에서 불가능하면 build만 수행하고 deploy는 건너뜁니다. Private 저장소의 Pages에는 GitHub Pro/Team 등 해당 기능을 지원하는 요금제가 필요합니다. 저장소를 임의로 Public으로 변경하지 않습니다.\n\n## 모델 자료와 공개 범위\n\n웹에서 배포하는 XML/STL/ONNX는 참가자가 다운로드할 수 있습니다. 공개를 승인한 자료만 public/models/rubi/에 넣습니다. XML은 질량, 관성, 관절, 접촉 등 시뮬레이션 정보도 포함합니다.\n\n## 설문\n\npublic/study.json은 draft로 시작합니다. 이는 준비/파일럿 화면이지 본 조사 승인 상태가 아닙니다. released 전환 전에 실제 RUBI 보행과 변인통제를 검증하고 별도 응답 API를 연결해야 합니다. API 코드는 api/server.mjs, 상세 초기 설명은 docs/UPSTREAM_WEB_README.md를 참고하세요. GitHub Pages 자체는 응답 DB를 실행하지 않습니다.\n\n## 검증 한계\n\n제어 계산 테스트 통과가 Gazebo와 MuJoCo에서 같은 보행을 보장하지는 않습니다. 실제 STL과 정책을 연결한 평지/단차 보행은 별도 검증 대상입니다.\n''')
          Path('public/models/rubi/meshes').mkdir(parents=True, exist_ok=True)
          Path('public/models/rubi/meshes/.gitkeep').touch()
          PY
          rm -rf _upstream
          if test "${{ github.event_name }}" = push && test "${{ github.ref }}" = refs/heads/main; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Import standalone RUBI WASM app without ROS packages or private binary assets'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check hosted assets when validator exists
        run: |
          if test -f tools/check_assets.py; then python3 tools/check_assets.py; fi
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Browser smoke checks when available
        run: |
          if test -f tools/browser-smoke.mjs; then
            npm install --no-save --package-lock=false playwright@1.55.0
            npx playwright install --with-deps chromium
            node tools/browser-smoke.mjs
          fi
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Check Pages availability without changing repository visibility
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages-error.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build succeeded. GitHub Pages is not enabled or unavailable to this token/plan. Use Settings > Pages > GitHub Actions. Private source stays private.'
          fi
  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static browser application
        id: deployment
        uses: actions/deploy-pages@v4
