name: RUBI WASM Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy when GitHub Pages is configured
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rubi-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Test controller, hosted assets, survey and response API
        run: npm test
      - name: Validate assets (missing files allowed for draft only)
        run: python3 tools/check_assets.py
      - name: Build for the standalone Pages path
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Run Chromium UI and WASM runtime smoke checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
          node tools/browser-smoke.mjs
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Check Pages availability without changing repository visibility
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/tmp/pages-error.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build succeeded. Pages is not enabled or unavailable to this token/plan. Use Settings > Pages > GitHub Actions. Repository visibility is unchanged.'
          fi
  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static browser application
        id: deployment
        uses: actions/deploy-pages@v4
