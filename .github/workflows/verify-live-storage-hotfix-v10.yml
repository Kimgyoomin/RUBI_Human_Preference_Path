name: Verify live storage fast v11
on:
  push:
    branches: [audit/external-pilot-v2-live]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping deployed Apps Script only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://script.google.com/macros/s/AKfycbzkk-mfGemkhbChiP7ldNRfIUYLNJTVzVh40JtScTIYSG2qP6QpWh9rtFHsOKfSvnTnWw/exec';
          const payload={
            kind:'ping',
            requestId:'audit-'+Date.now(),
            payload:{experimentId:'rubi-hpp-main-v1',studyStatus:'released',protocolVersion:'height-blocks-no-repeat-v9'}
          };
          const r=await fetch(endpoint,{
            method:'POST',
            headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},
            body:new URLSearchParams({payload:JSON.stringify(payload)}),
            redirect:'follow',
            signal:AbortSignal.timeout(20000)
          });
          if(!r.ok) throw new Error('HTTP '+r.status);
          const text=await r.text();
          if(!text.includes('fast-session-state-v11')) throw new Error('storage fast marker missing');
          if(!text.includes('no-repeat-collector-v9')) throw new Error('releaseVersion mismatch');
          if(!text.includes('collectionOpen')||!text.includes('true')) throw new Error('collectionOpen not true');
          console.log('LIVE_STORAGE_FAST_V11_PASS');
          console.log(text.replace(/\s+/g,' ').slice(0,2000));
          NODE
