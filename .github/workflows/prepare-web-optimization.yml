name: Prepare optimized RUBI web bundle
on:
  push:
    branches: [perf/web-survey-20260921]
    paths:
      - '.github/workflows/prepare-web-optimization.yml'
      - 'tools/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-rubi-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/perf/web-survey-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/web-survey-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned visual generator dependencies
        run: python -m pip install numpy==2.2.6 fast-simplification==0.1.13
      - name: Preserve source fingerprints
        run: find public/models/rubi -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/rubi-original.sha256
      - name: Generate separate visual-only bundle and migrate source
        run: |
          python tools/optimize_web_assets.py --apply
          python tools/apply_web_optimization.py
          python tools/finalize_web_optimization.py
          sha256sum --check /tmp/rubi-original.sha256
      - name: Install and validate
        run: |
          npm ci
          npm test
          python3 tools/check_assets.py --require-complete
          npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Real-model browser benchmark and actual policy rollouts
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
          node tools/performance-check.mjs
          node tools/browser-smoke.mjs
      - name: Save measured report and commit validated changes on the working branch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/performance-report.json').read_text())
          for model in report['models']:
              model.pop('state',None)
              model.pop('samples',None)
          Path('docs/performance-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          sha256sum --check /tmp/rubi-original.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore src public/models/rubi-web public/study.json package.json docs tools/prune-web-dist.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Apply validated web visual bundle, cache, renderer and performance instrumentation'
            git push origin HEAD:perf/web-survey-20260921
          fi
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-optimization-diagnostics
          path: |
            artifacts/
            docs/web-assets-report.json
          if-no-files-found: ignore
